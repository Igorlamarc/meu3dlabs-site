<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso — Meu 3D Labs</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="img/logo/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f1e3d;--navy-2:#16294f;--orange:#f26522;--orange-2:#ff8a3d;--light:#f5f7fa;--white:#fff;--gray:#4a5161;--border:#e3e8ef;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',system-ui,-apple-system,Arial,sans-serif;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#1c2430;}
a{text-decoration:none;color:inherit;}
.login-card{background:var(--white);border-radius:18px;padding:40px 32px;width:100%;max-width:420px;box-shadow:0 24px 70px rgba(0,0,0,.35);}
.logo-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;}
.logo-row img{height:44px;width:auto;}
.logo-row span{font-weight:800;font-size:22px;color:var(--navy);}
.logo-row span b{color:var(--orange);}
.login-card h1{text-align:center;font-size:20px;color:var(--navy);margin-bottom:6px;font-weight:800;}
.login-card .sub{text-align:center;font-size:13px;color:var(--gray);margin-bottom:26px;}
.option-list{display:flex;flex-direction:column;gap:14px;}
.option{display:flex;align-items:center;gap:16px;padding:20px;border:2px solid var(--border);border-radius:14px;cursor:pointer;transition:.25s;background:var(--white);}
.option:hover{border-color:var(--orange);box-shadow:0 8px 24px rgba(242,101,34,.12);transform:translateY(-2px);}
.option-icon{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;background:linear-gradient(135deg,#eef3fb,#dbe4f0);}
.option-icon.func{background:linear-gradient(135deg,#fdeee5,#fbdcc9);}
.option-text h3{font-size:16px;color:var(--navy);font-weight:700;margin-bottom:3px;}
.option-text p{font-size:13px;color:var(--gray);}
.option-arrow{margin-left:auto;color:var(--orange);font-size:20px;font-weight:700;}
.back-link{display:block;text-align:center;margin-top:22px;font-size:13px;color:var(--gray);transition:.2s;}
.back-link:hover{color:var(--orange);}
</style>
</head>
<body>
<div class="login-card">
<div class="logo-row">
<img src="img/logo/logo.png" alt="Meu 3D Labs">
<span>Meu<b>3D</b>Labs</span>
</div>
<h1>Área de acesso</h1>
<p class="sub">Escolha como você quer entrar</p>
<div class="option-list">
<a class="option" href="acompanhar.html">
<div class="option-icon">📦</div>
<div class="option-text">
<h3>Sou cliente</h3>
<p>Acompanhar o status do meu pedido</p>
</div>
<div class="option-arrow">›</div>
</a>
<a class="option" href="admin.html">
<div class="option-icon func">🔧</div>
<div class="option-text">
<h3>Sou funcionário</h3>
<p>Acesso interno da equipe Meu 3D Labs</p>
</div>
<div class="option-arrow">›</div>
</a>
</div>
<a class="back-link" href="index.html">← Voltar para o site</a>
</div>
</body>
</html>
