# ============================================================
# Meu 3D Labs — configuração Netlify
# Site: meu3dlabs.com.br
# Backend: https://meu3dlabs-backend.onrender.com
# ============================================================

# ---------- Build ----------
[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "20"
  TZ = "America/Sao_Paulo"

# ---------- Funções ----------
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------- Edge Functions ----------
[edge_functions]
  directory = "netlify/edge-functions"

# ---------- Dev local (netlify dev) ----------
[dev]
  framework = "#static"
  port = 8888

# ============================================================
# HEADERS
# ============================================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/auth/login"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ============================================================
# REDIRECTS / PROXY  (status 200 = rewrite, a URL não muda)
# A ordem importa: o Netlify processa de cima para baixo.
# ============================================================

# API do backend — elimina CORS no front
[[redirects]]
  from = "/api/*"
  to = "https://meu3dlabs-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Sitemap gerado pelo backend
[[redirects]]
  from = "/sitemap-produtos.xml"
  to = "https://meu3dlabs-backend.onrender.com/api/sitemap-produtos.xml"
  status = 200
  force = true

# ============================================================
# PRODUTOS — ESTA ERA A REGRA QUE FALTAVA
# ------------------------------------------------------------
# Sem ela, /produto/<slug> não existe como arquivo e o Netlify
# devolve o 404 genérico. produto.html lê o slug da própria URL
# (slugDaURL) e monta a página.
#
# Se existir a Edge Function produto-404.js registrada em
# netlify/edge-functions/, ela roda ANTES e continua mandando,
# com a vantagem de devolver status 404 real para peça inexistente.
# Este rewrite é a rede de segurança para quando ela não roda.
# ============================================================
[[redirects]]
  from = "/produto/*"
  to = "/produto.html"
  status = 200
  force = true

# Atalho legado: /loja/<slug> também abre a página do produto
[[redirects]]
  from = "/loja/:slug"
  to = "/produto.html?produto=:slug"
  status = 301
  force = false