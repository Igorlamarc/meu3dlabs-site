# ============================================================
# Meu 3D Labs — configuração Netlify
# Site: meu3dlabs.com.br
# Backend: https://meu3dlabs-backend.onrender.com
# ============================================================

# ---------- Build ----------
[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "20"
  TZ = "America/Sao_Paulo"

# ---------- Funções ----------
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------- Dev local (netlify dev) ----------
[dev]
  framework = "#static"
  port = 8888

# ============================================================
# HEADERS
# ============================================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/auth/login"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ============================================================
# REDIRECTS / PROXY  (status 200 = rewrite, a URL não muda)
# A ordem importa: o Netlify processa de cima para baixo.
# ============================================================

# API do backend — elimina CORS no front
[[redirects]]
  from = "/api/*"
  to = "https://meu3dlabs-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Sitemap gerado pelo backend
[[redirects]]
  from = "/sitemap-produtos.xml"
  to = "https://meu3dlabs-backend.onrender.com/api/sitemap-produtos.xml"
  status = 200
  force = true

# ============================================================
# PRODUTOS — SSR no Render (card profissional no WhatsApp)
# ------------------------------------------------------------
# /produto/<slug> passa a ser servida pelo SSR do backend:
#   - og:image = banner 1200x630 com preço, categoria e marca
#   - og:url no próprio host
#   - canonical + JSON-LD
#
# Se o backend estiver fora do ar, SOMENTE /produto/* falha.
# Home, loja.html, admin-loja e produto.html seguem intactos.
#
# IMPORTANTE: /produto.html NÃO é afetado por esta regra —
# o padrão exige a barra depois de "produto".
# ============================================================
[[redirects]]
  from = "/produto/*"
  to = "https://meu3dlabs-backend.onrender.com/produto/:splat"
  status = 200
  force = true